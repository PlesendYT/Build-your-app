<!DOCTYPE html>
<!-- Base HTML template for the static site generator -->
<!-- Rendered with Jinja2; override blocks in child templates -->
<html lang="en">
<head>
  <!-- Page title injected by the generator -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — My Static Site</title>
  <style>
    /* Minimal base styling for generated pages */
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.6; color: #333; }
    h1, h2, h3 { color: #1a1a1a; }
    code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- Site header with navigation link back to home -->
  <header>
    <h1>My Static Site</h1>
    <nav><a href="/">Home</a></nav>
  </header>

  <!-- Main content area rendered from Markdown -->
  <main>
    {{ content }}
  </main>

  <!-- Footer with copyright notice -->
  <footer>
    <p>&copy; 2026 Build Your App. Generated with SSG.</p>
  </footer>
</body>
</html>
