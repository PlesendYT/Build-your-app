# Docker Compose configuration for the microservice demo
# Spins up the user-service, order-service, and supporting infrastructure
# Usage: docker compose up -d

version: "3.9"

services:
  # ---------- User Microservice ----------
  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "8081:8080"               # Expose user API on host port 8081
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped

  # ---------- Order Microservice ----------
  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8082:8080"               # Expose order API on host port 8082
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USER_SERVICE_URL=http://user-service:8080
    depends_on:
      - user-service
    restart: unless-stopped
