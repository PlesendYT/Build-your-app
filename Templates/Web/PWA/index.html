<!DOCTYPE html>
<!-- PWA Notes - a Progressive Web App for taking notes offline -->
<html lang="en">
<head>
  <!-- Document metadata and PWA manifest -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Notes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with app title and install button -->
  <header>
    <h1>📝 PWA Notes</h1>
    <button id="installBtn" class="hidden btn">Install App</button>
  </header>

  <!-- Main content: note form and note list -->
  <main>
    <form id="noteForm">
      <input type="text" id="noteInput" placeholder="Enter a note..." required>
      <button type="submit" class="btn">Add Note</button>
    </form>
    <ul id="noteList"></ul>
  </main>

  <!-- Footer with app description -->
  <footer>
    <p>Offline-ready Progressive Web App</p>
  </footer>

  <!-- Application scripts -->
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
