<!DOCTYPE html>
<!-- File Hosting - upload and share files with download links -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Hosting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f0f4f8; }
    header { background: #1e293b; color: white; padding: 1rem 2rem; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .upload-area { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); margin-bottom: 2rem; text-align: center; border: 2px dashed #cbd5e1; }
    .upload-area.dragover { border-color: #2563eb; background: #eff6ff; }
    #file-input { display: none; }
    .btn { background: #2563eb; color: white; padding: 0.6rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; }
    .file-list { background: white; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
    .file-item { padding: 1rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .file-item .info { flex: 1; }
    .file-item .name { font-weight: 600; }
    .file-item .meta { font-size: 0.85rem; color: #64748b; }
    .file-item .actions a { color: #2563eb; text-decoration: none; margin-left: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>File Hosting</h1>
  </header>

  <div class="container">
    <!-- Upload area with drag-drop support -->
    <div class="upload-area" id="drop-zone">
      <p>Drag and drop files here or</p>
      <button class="btn" id="upload-btn">Choose File</button>
      <input type="file" id="file-input">
    </div>

    <!-- List of uploaded files -->
    <div class="file-list" id="file-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
