<!DOCTYPE html>
<!-- URL Shortener - paste a long URL to get a short link -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 500px; text-align: center; }
    h1 { margin-bottom: 1rem; color: #1e293b; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
    input:focus { outline: none; border-color: #667eea; }
    button { background: #667eea; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #5a67d8; }
    #result { margin-top: 1rem; padding: 1rem; background: #f0f4ff; border-radius: 8px; display: none; }
    #result a { color: #667eea; word-break: break-all; }
    #stats { margin-top: 0.5rem; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <!-- Main card with URL input and results -->
  <div class="card">
    <h1>URL Shortener</h1>
    <p>Paste a long URL to get a short, shareable link</p>
    <input type="url" id="url-input" placeholder="https://example.com/very/long/url" required>
    <button id="shorten-btn">Shorten</button>
    <div id="result">
      <p>Short URL:</p>
      <a id="short-link" href="#" target="_blank"></a>
      <p id="stats"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
