<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas 2D Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: system-ui, sans-serif; }
    canvas { border: 2px solid #333; background: #1a1a2e; }
    #ui { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); color: #fff; font-size: 1.5rem; display: flex; gap: 2rem; }
  </style>
</head>
<body>
  <div id="ui">
    <span>Punkte / Score: <span id="score">0</span></span>
    <span>Leben / Lives: <span id="lives">3</span></span>
  </div>
  <canvas id="game" width="640" height="480"></canvas>
  <script type="module" src="game.js"></script>
</body>
</html>
