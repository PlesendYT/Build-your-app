<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electron App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 2rem; color: #222; }
    header { text-align: center; padding: 2rem 0; }
    h1 { font-size: 2.5rem; }
    main { max-width: 640px; margin: 0 auto; }
    section { background: #fff; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 1rem; }
    p { margin-bottom: 0.5rem; }
    code { background: #eee; padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <h1>Electron Desktop</h1>
    <p>Desktop App Template</p>
  </header>

  <main>
    <section>
      <h2>System Info</h2>
      <p>App Version: <span id="version">—</span></p>
      <p>Plattform / Platform: <span id="platform">—</span></p>
    </section>

    <section>
      <h2>Info</h2>
      <p>Dies ist eine Electron-Desktop-App.</p>
      <p>Nutze die <code>electronAPI</code> im globalen Kontext für IPC.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
