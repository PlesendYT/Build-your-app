<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web-Vanilla App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Web-Vanilla</h1>
    <p>Vanilla JavaScript App</p>
  </header>

  <main>
    <section id="counter">
      <h2>Counter</h2>
      <p id="counter-value">0</p>
      <button id="btn-increment">+1</button>
      <button id="btn-decrement">-1</button>
      <button id="btn-reset">Reset</button>
    </section>

    <section id="weather">
      <h2>Wetter / Weather</h2>
      <button id="btn-fetch">Daten laden / Load data</button>
      <pre id="weather-output">—</pre>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Build-your-app</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
