[package]
name = "password-manager"
version = "0.1.0"
edition = "2021"
description = "Encrypted CLI password manager with master password and CRUD operations"

[dependencies]
# AES-256-GCM encryption for the password vault
aes-gcm = "0.10"
# Key derivation (Argon2) for master password hashing
argon2 = "0.5"
# Secure random number generation for salts and nonces
rand = "0.8"
# Serialization of the vault to JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Filesystem vault path handling
dirs = "5"
