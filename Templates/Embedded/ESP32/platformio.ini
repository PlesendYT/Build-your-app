; PlatformIO project configuration for the ESP32 template
; Build and upload with: pio run --target upload
; Monitor with: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Required library dependencies for MQTT and WiFi
lib_deps =
    bblanchon/ArduinoJson @ ^6.21
    knolleary/PubSubClient @ ^2.8
