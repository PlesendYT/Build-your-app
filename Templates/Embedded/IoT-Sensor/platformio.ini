; PlatformIO configuration for the ESP32 IoT sensor firmware
; Uses deep sleep between readings for low-power operation

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library @ ^1.4.4
    knolleary/PubSubClient @ ^2.8
