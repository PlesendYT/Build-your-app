<!DOCTYPE html>
<!-- Note Taking App - three-pane layout: folders, notes list, editor -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taking App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Left pane: folder tree with add folder input -->
  <div id="sidebar">
    <h3>Folders</h3>
    <ul id="folderList"></ul>
    <input id="folderInput" placeholder="New folder">
    <button onclick="addFolder()">Add</button>
  </div>

  <!-- Middle pane: searchable list of notes in the selected folder -->
  <div id="noteListPane">
    <input id="searchInput" placeholder="Search notes...">
    <ul id="notesList"></ul>
  </div>

  <!-- Right pane: note title and content editor -->
  <div id="editorPane">
    <input id="noteTitle" placeholder="Note title">
    <textarea id="noteContent" placeholder="Write your note here..."></textarea>
    <button onclick="saveNote()">Save</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
