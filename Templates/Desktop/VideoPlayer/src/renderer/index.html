<!DOCTYPE html>
<!-- Video Player - drag-drop video playback with playlist -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: white; height: 100vh; display: flex; flex-direction: column; }
    #dropZone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    #dropZone.dragover { background: #1e3a5f; }
    video { max-width: 100%; max-height: calc(100vh - 100px); display: none; }
    #controls { display: none; gap: 0.5rem; padding: 0.5rem; background: #222; align-items: center; }
    #controls.visible { display: flex; }
    #controls button { background: #444; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; }
    #controls input[type="range"] { flex: 1; }
    #playlist { position: absolute; right: 0; top: 0; width: 200px; background: #222; padding: 0.5rem; max-height: 100%; overflow-y: auto; display: none; }
    #playlist.visible { display: block; }
    #playlist li { padding: 0.3rem; cursor: pointer; list-style: none; }
    #playlist li:hover { background: #444; }
    #dropMsg { color: #888; font-size: 1.2rem; }
  </style>
</head>
<body>
  <!-- Drop zone for drag-and-drop video loading -->
  <div id="dropZone">
    <video id="videoEl" controls></video>
    <div id="dropMsg">Drop video files here or click Open</div>
    <ul id="playlist"></ul>
  </div>

  <!-- Playback controls: play/pause, seek, volume, playlist toggle -->
  <div id="controls">
    <button id="openBtn">Open</button>
    <button id="playBtn">Play</button>
    <span id="timeDisplay">0:00 / 0:00</span>
    <input type="range" id="seek" value="0">
    <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
    <button id="playlistBtn">Playlist</button>
  </div>

  <script src="player.js"></script>
</body>
</html>
