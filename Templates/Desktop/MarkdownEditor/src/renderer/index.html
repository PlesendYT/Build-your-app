<!DOCTYPE html>
<!-- Markdown Editor - split pane with live preview and toolbar -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toolbar with file open, save, and preview toggle buttons -->
  <div id="toolbar">
    <button onclick="openFile()">Open</button>
    <button onclick="saveFile()">Save</button>
    <button onclick="togglePreview()">Toggle Preview</button>
    <span id="fileName">Untitled.md</span>
  </div>

  <!-- Split pane: text editor on the left, rendered preview on the right -->
  <div id="container">
    <textarea id="editor" placeholder="Write markdown here..."></textarea>
    <div id="preview"></div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
