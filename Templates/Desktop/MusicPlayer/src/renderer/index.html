<!DOCTYPE html>
<!-- Music Player - library browser with audio playback controls -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: white; height: 100vh; display: flex; flex-direction: column; }
    #toolbar { padding: 0.5rem 1rem; background: #1e293b; display: flex; gap: 0.5rem; align-items: center; }
    #toolbar button { background: #2563eb; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; }
    #library { flex: 1; overflow-y: auto; padding: 0.5rem; }
    #library li { padding: 0.5rem; cursor: pointer; list-style: none; border-bottom: 1px solid #333; }
    #library li:hover { background: #1e3a5f; }
    #library li.playing { background: #2563eb; }
    #player { padding: 0.5rem 1rem; background: #1e293b; display: flex; gap: 0.5rem; align-items: center; }
    #player button { background: #444; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; }
    #player input[type="range"] { flex: 1; }
    #nowPlaying { flex: 1; font-size: 0.9rem; }
    #searchInput { padding: 0.3rem; border-radius: 4px; border: none; flex: 1; }
    audio { display: none; }
  </style>
</head>
<body>
  <!-- Toolbar with library scan and search -->
  <div id="toolbar">
    <button onclick="scanLibrary()">Scan Library</button>
    <input id="searchInput" placeholder="Search songs..." oninput="renderLibrary()">
  </div>

  <!-- Scrollable song library list -->
  <ul id="library"></ul>

  <!-- Bottom audio player controls -->
  <div id="player">
    <button id="playBtn">Play</button>
    <span id="nowPlaying">No track selected</span>
    <span id="timeDisplay">0:00 / 0:00</span>
    <input type="range" id="seek" value="0">
    <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
  </div>

  <audio id="audioEl"></audio>
  <script src="app.js"></script>
</body>
</html>
