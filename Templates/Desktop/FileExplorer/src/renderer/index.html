<!DOCTYPE html>
<!-- File Explorer - directory navigation with file operations -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation bar with path display and new folder button -->
  <div id="navBar">
    <button onclick="goBack()">Back</button>
    <span id="currentPath">/</span>
    <button onclick="newFolder()">New Folder</button>
  </div>

  <!-- File listing table with name, size, and actions -->
  <div id="fileList">
    <table>
      <thead><tr><th>Name</th><th>Size</th><th>Action</th></tr></thead>
      <tbody id="entries"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
