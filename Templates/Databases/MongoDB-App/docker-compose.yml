# MongoDB + MongoExpress starter stack
# Run: docker compose up -d

version: "3.8"

services:
  # MongoDB document database server
  mongodb:
    image: mongo:7
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017" # Default MongoDB port
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: myapp
    volumes:
      - mongo-data:/data/db # Persistent data storage

  # MongoExpress web-based MongoDB admin interface
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081" # Access at http://localhost:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo-data:
