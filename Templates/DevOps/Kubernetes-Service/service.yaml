# Kubernetes Service exposing the Go deployment internally via ClusterIP
# Other services within the cluster can reach it at "go-service:8080"
apiVersion: v1
kind: Service
metadata:
  name: go-service
  labels:
    app: go-service
    tier: backend
spec:
  # ClusterIP is the default type — only accessible inside the cluster
  type: ClusterIP
  selector:
    app: go-service
  ports:
    - protocol: TCP
      port: 8080           # Port the service listens on
      targetPort: 8080      # Port the container listens on
      name: http
