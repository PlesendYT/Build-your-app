# Kubernetes Ingress that routes external HTTP traffic to the go-service
# Requires an Ingress controller (e.g. nginx-ingress, traefik) installed on the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-service-ingress
  annotations:
    # Use the nginx ingress controller for path-based routing
    kubernetes.io/ingress.class: nginx
    # Increase the upload size limit if handling large payloads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-service
                port:
                  number: 8080
  # Optional TLS configuration — uncomment and adjust for production
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: api-tls
