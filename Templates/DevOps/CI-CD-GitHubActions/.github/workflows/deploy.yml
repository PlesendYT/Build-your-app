# Deploy workflow triggered by pushes to main after CI passes
# Builds a Docker image, pushes it to a registry, then deploys to a server
name: Deploy

on:
  push:
    branches: [main]

# Allow one deployment at a time; cancel in-progress runs if a new push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Build and push Docker image ----------
  docker:
    runs-on: ubuntu-latest
    # The job output (image tag) is consumed by the deploy job
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to the container registry (configure repo secrets first)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Generate Docker image metadata tags and labels
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-app
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      # Build and push the image to the registry
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Deploy to production server ----------
  deploy:
    runs-on: ubuntu-latest
    needs: docker  # Only deploy if the Docker job succeeded

    steps:
      # Deploy via SSH to the production server using a script
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Pull the latest image and restart the container
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --name my-app -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/my-app:latest
