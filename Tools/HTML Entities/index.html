<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTML Entities · Build-your-app</title>
<link rel="stylesheet" href="../_shared/tools.css" />
</head>
<body>
<header id="toolbar-host"></header>
<main class="shell">
  <h1>HTML Entities</h1>
  <p class="sub">Encode special characters as named, decimal, or hex entities, and decode them back.</p>

  <section class="panel">
    <div class="panel-body">
      <div class="row">
        <label for="mode" style="margin:0">Encode as</label>
        <select id="mode">
          <option value="name">Named (&amp;copy;)</option>
          <option value="decimal">Decimal (&amp;#169;)</option>
          <option value="hex">Hex (&amp;#xa9;)</option>
        </select>
        <label class="row" style="gap:6px"><input id="nonAscii" type="checkbox" checked /> Encode non-ASCII</label>
        <label class="row" style="gap:6px"><input id="always" type="checkbox" checked /> Encode <code>&amp; &lt; &gt; " '</code> too</label>
        <span class="spacer" style="flex:1"></span>
        <button id="swap" class="ghost">Swap</button>
      </div>
    </div>
  </section>

  <section class="grid cols-2">
    <div class="panel">
      <div class="panel-header"><h2 style="margin:0">Input</h2></div>
      <div class="panel-body">
        <textarea id="in" placeholder="Plain text or entities"></textarea>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2 style="margin:0">Output</h2>
        <span class="spacer" style="flex:1"></span>
        <button id="copy" class="ghost">Copy</button>
      </div>
      <div class="panel-body">
        <textarea id="out" placeholder="Result"></textarea>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-body">
      <button id="doEncode" class="primary">Encode</button>
      <button id="doDecode">Decode</button>
      <span class="spacer" style="flex:1"></span>
      <span id="status" class="tag">idle</span>
    </div>
  </section>
</main>
<script src="../_shared/app.js"></script>
<script>
  Tools.mountToolbar("#toolbar-host", { tool: "HTML Entities" });

  // Named entities (subset sufficient for common cases; we also fall back to numeric).
  var NAMES = {
    34: "quot", 38: "amp", 39: "apos", 60: "lt", 62: "gt", 160: "nbsp", 161: "iexcl", 162: "cent", 163: "pound", 164: "curren",
    165: "yen", 166: "brvbar", 167: "sect", 168: "uml", 169: "copy", 170: "ordf", 171: "laquo", 172: "not", 173: "shy", 174: "reg",
    175: "macr", 176: "deg", 177: "plusmn", 178: "sup2", 179: "sup3", 180: "acute", 181: "micro", 182: "para", 183: "middot", 184: "cedil",
    185: "sup1", 186: "ordm", 187: "raquo", 188: "frac14", 189: "frac12", 190: "frac34", 191: "iquest", 192: "Agrave", 193: "Aacute",
    194: "Acirc", 195: "Atilde", 196: "Auml", 197: "Aring", 198: "AElig", 199: "Ccedil", 200: "Egrave", 201: "Eacute", 202: "Ecirc",
    203: "Euml", 204: "Igrave", 205: "Iacute", 206: "Icirc", 207: "Iuml", 208: "ETH", 209: "Ntilde", 210: "Ograve", 211: "Oacute",
    212: "Ocirc", 213: "Otilde", 214: "Ouml", 215: "times", 216: "Oslash", 217: "Ugrave", 218: "Uacute", 219: "Ucirc", 220: "Uuml",
    221: "Yacute", 222: "THORN", 223: "szlig", 224: "agrave", 225: "aacute", 226: "acirc", 227: "atilde", 228: "auml", 229: "aring",
    230: "aelig", 231: "ccedil", 232: "egrave", 233: "eacute", 234: "ecirc", 235: "euml", 236: "igrave", 237: "iacute", 238: "icirc",
    239: "iuml", 240: "eth", 241: "ntilde", 242: "ograve", 243: "oacute", 244: "ocirc", 245: "otilde", 246: "ouml", 247: "divide",
    248: "oslash", 249: "ugrave", 250: "uacute", 251: "ucirc", 252: "uuml", 253: "yacute", 254: "thorn", 255: "yuml", 8211: "ndash",
    8212: "mdash", 8216: "lsquo", 8217: "rsquo", 8218: "sbquo", 8220: "ldquo", 8221: "rdquo", 8222: "bdquo", 8226: "bull", 8230: "hellip",
    8364: "euro", 8482: "trade", 8592: "larr", 8593: "uarr", 8594: "rarr", 8595: "darr", 8734: "infin", 8736: "ang", 8743: "and",
    8744: "or", 8776: "asymp", 8800: "ne", 8804: "le", 8805: "ge", 9674: "cir", 9824: "spades", 9827: "clubs", 9829: "hearts", 9830: "diams"
  };

  var inEl = Tools.qs("#in"), outEl = Tools.qs("#out"), status = Tools.qs("#status");
  function setStatus(kind, msg) { status.className = "tag " + (kind === "ok" ? "ok" : "err"); status.textContent = msg; }

  function encode() {
    var mode = Tools.qs("#mode").value;
    var nonAscii = Tools.qs("#nonAscii").checked;
    var always = Tools.qs("#always").checked;
    var s = inEl.value;
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      var replace = false;
      if (always && (code === 38 || code === 60 || code === 62 || code === 34 || code === 39)) replace = true;
      else if (nonAscii && code > 126) replace = true;
      else if (nonAscii && code < 32 && code !== 9 && code !== 10 && code !== 13) replace = true;
      if (!replace) { out += s[i]; continue; }
      if (mode === "name" && NAMES[code]) out += "&" + NAMES[code] + ";";
      else if (mode === "decimal") out += "&#" + code + ";";
      else if (mode === "hex") out += "&#x" + code.toString(16) + ";";
      else out += s[i];
    }
    outEl.value = out;
    setStatus("ok", "Encoded " + out.length + " chars");
  }

  function decode() {
    try {
      var ta = document.createElement("textarea");
      ta.innerHTML = inEl.value;
      outEl.value = ta.value;
      setStatus("ok", "Decoded");
    } catch (e) { setStatus("err", e.message || String(e)); }
  }

  Tools.qs("#doEncode").onclick = encode;
  Tools.qs("#doDecode").onclick = decode;
  Tools.qs("#swap").onclick = function () { var t = inEl.value; inEl.value = outEl.value; outEl.value = t; };
  Tools.qs("#copy").onclick = function () { Tools.copyText(outEl.value).then(function (ok) { Tools.toast(ok ? "Copied" : "Copy failed", ok ? "ok" : "err"); }); };
  inEl.value = "<p>Hello & \"world\" — café € ❤</p>";
  encode();
</script>
</body>
</html>
