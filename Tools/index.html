<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tools · Build-your-app</title>
<link rel="stylesheet" href="_shared/tools.css" />
</head>
<body>
<header id="toolbar-host"></header>
<main class="shell">
  <section class="hero">
    <h1>Developer tools</h1>
    <p>Small, focused utilities that run entirely in the browser. Open any tool below; nothing leaves your machine.</p>
  </section>

  <section class="hub" id="hub"></section>

  <p class="sub" style="margin-top:24px">More tools coming. Drop a new folder into <code>Tools/</code> with an <code>index.html</code> and it can be added here.</p>
</main>
<script src="_shared/app.js"></script>
<script>
  var TOOLS = [
    { name: "API Tester",         href: "API Tester/index.html",         desc: "Send HTTP requests, inspect headers and bodies.", tag: "network" },
    { name: "Base64 Tool",        href: "Base64 Tool/index.html",        desc: "Encode and decode text or files using Base64.",     tag: "encoding" },
    { name: "Color Palette",      href: "Color Palette/index.html",      desc: "Generate palettes from a base color, export CSS.",  tag: "design" },
    { name: "JSON Formatter",     href: "JSON Formatter/index.html",     desc: "Pretty-print, minify, and validate JSON.",           tag: "data" },
    { name: "Markdown Preview",   href: "Markdown Preview/index.html",   desc: "Live Markdown editor with side-by-side preview.",   tag: "writing" },
    { name: "Password Generator", href: "Password Generator/index.html", desc: "Create strong passwords with custom rules.",        tag: "security" },
    { name: "Regex Tester",       href: "Regex Tester/index.html",       desc: "Build and test regular expressions with flags.",     tag: "regex" },
    { name: "Timestamp Tool",     href: "Timestamp Tool/index.html",     desc: "Convert between Unix, ISO, and human dates.",        tag: "time" },
    { name: "Cron Parser",         href: "Cron Parser/index.html",         desc: "Explain a 5-field cron expression and list the next 10 fires.",       tag: "time" },
    { name: "Diff Viewer",         href: "Diff Viewer/index.html",         desc: "Side-by-side or unified diff with whitespace and case options.",       tag: "compare" },
    { name: "Hex Viewer",          href: "Hex Viewer/index.html",          desc: "Hex/ASCII dump of a file or pasted bytes.",                            tag: "binary" },
    { name: "HTML Entities",       href: "HTML Entities/index.html",       desc: "Encode or decode named, decimal, and hex entities.",                   tag: "encoding" },
    { name: "JWT Decoder",         href: "JWT Decoder/index.html",         desc: "Inspect JWT header, payload, claims, and expiration.",                tag: "security" },
    { name: "Lorem Ipsum",         href: "Lorem Ipsum/index.html",         desc: "Generate placeholder text by paragraphs, sentences, or words.",       tag: "writing" },
    { name: "SVG Optimizer",       href: "SVG Optimizer/index.html",       desc: "Strip comments, metadata, and whitespace from SVG markup.",           tag: "design" },
    { name: "URL Encoder",         href: "URL Encoder/index.html",         desc: "Percent-encode/decode strings, paths, and form values.",              tag: "encoding" },
    { name: "UUID Generator",      href: "UUID Generator/index.html",      desc: "Generate UUID v4 or v7 in hyphen, urn, hex, or base36 form.",          tag: "data" },
    { name: "Website To EXE",      href: "Website To EXE/index.html",      desc: "Wrap a website into a portable Windows executable.",                  tag: "build" }
  ];

  Tools.mountToolbar("#toolbar-host", { tool: "Hub" });
  var hub = Tools.qs("#hub");
  TOOLS.forEach(function (t) {
    var card = Tools.el('<div class="card"><span class="pill"></span><h3></h3><p></p><div class="actions"><a class="btn primary" href="#">Open</a></div></div>');
    card.querySelector(".pill").textContent = t.tag;
    card.querySelector("h3").textContent = t.name;
    card.querySelector("p").textContent = t.desc;
    card.querySelector("a").href = t.href;
    hub.appendChild(card);
  });
</script>
</body>
</html>
