<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lorem Ipsum · Build-your-app</title>
<link rel="stylesheet" href="../_shared/tools.css" />
</head>
<body>
<header id="toolbar-host"></header>
<main class="shell">
  <h1>Lorem Ipsum</h1>
  <p class="sub">Generate placeholder text by paragraphs, sentences, or words. Useful for mockups, layouts, and tests.</p>

  <section class="panel">
    <div class="panel-body">
      <div class="row">
        <div>
          <label for="count">How many</label>
          <input id="count" type="number" value="3" min="1" max="200" style="width:90px" />
        </div>
        <div>
          <label for="unit">Unit</label>
          <select id="unit">
            <option value="paragraphs" selected>Paragraphs</option>
            <option value="sentences">Sentences</option>
            <option value="words">Words</option>
          </select>
        </div>
        <div>
          <label for="wordsPer">Words / sentence</label>
          <input id="wordsPer" type="number" value="14" min="4" max="40" style="width:80px" />
        </div>
        <div>
          <label for="sentencesPer">Sentences / paragraph</label>
          <input id="sentencesPer" type="number" value="5" min="1" max="20" style="width:80px" />
        </div>
        <label class="row" style="gap:6px;align-self:flex-end"><input id="startLorem" type="checkbox" checked /> Start with "Lorem ipsum…"</label>
        <span class="spacer" style="flex:1"></span>
        <button id="go" class="primary">Generate</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2 style="margin:0">Output</h2>
      <span class="spacer" style="flex:1"></span>
      <span id="meta" class="muted"></span>
      <button id="copy" class="ghost">Copy</button>
      <button id="download" class="ghost">Download .txt</button>
    </div>
    <div class="panel-body">
      <textarea id="out"></textarea>
    </div>
  </section>
</main>
<script src="../_shared/app.js"></script>
<script>
  Tools.mountToolbar("#toolbar-host", { tool: "Lorem Ipsum" });

  var WORDS = ("lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum").split(" ");

  function rand(max) { var b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % max; }
  function sentence(words) {
    var n = Math.max(3, words);
    var parts = [];
    for (var i = 0; i < n; i++) parts.push(WORDS[rand(WORDS.length)]);
    var s = parts.join(" ");
    return s.charAt(0).toUpperCase() + s.slice(1) + ".";
  }
  function paragraph(sentences) {
    var arr = [];
    for (var i = 0; i < sentences; i++) arr.push(sentence(8 + rand(8)));
    return arr.join(" ");
  }

  function generate() {
    var count = Math.max(1, Math.min(200, parseInt(Tools.qs("#count").value, 10) || 1));
    var unit = Tools.qs("#unit").value;
    var wordsPer = Math.max(4, Math.min(40, parseInt(Tools.qs("#wordsPer").value, 10) || 14));
    var sentencesPer = Math.max(1, Math.min(20, parseInt(Tools.qs("#sentencesPer").value, 10) || 5));
    var startLorem = Tools.qs("#startLorem").checked;

    var out = [];
    if (unit === "paragraphs") {
      for (var i = 0; i < count; i++) out.push(paragraph(sentencesPer));
      out = out.join("\n\n");
      if (startLorem && out.toLowerCase().indexOf("lorem") !== 0) out = "Lorem ipsum dolor sit amet. " + out;
    } else if (unit === "sentences") {
      for (var j = 0; j < count; j++) out.push(sentence(wordsPer));
      out = out.join(" ");
      if (startLorem && out.toLowerCase().indexOf("lorem") !== 0) out = "Lorem ipsum dolor sit amet. " + out;
    } else {
      var arr = [];
      for (var k = 0; k < count; k++) arr.push(WORDS[rand(WORDS.length)]);
      out = arr.join(" ");
      if (startLorem) out = "lorem " + out;
    }
    Tools.qs("#out").value = out;
    Tools.qs("#meta").textContent = out.length.toLocaleString() + " chars · " + out.split(/\s+/).filter(Boolean).length + " words";
  }

  Tools.qs("#go").onclick = generate;
  ["count", "unit", "wordsPer", "sentencesPer", "startLorem"].forEach(function (id) { Tools.qs("#" + id).addEventListener("input", generate); });
  Tools.qs("#copy").onclick = function () { Tools.copyText(Tools.qs("#out").value).then(function (ok) { Tools.toast(ok ? "Copied" : "Copy failed", ok ? "ok" : "err"); }); };
  Tools.qs("#download").onclick = function () { Tools.download("lorem.txt", Tools.qs("#out").value, "text/plain"); };
  generate();
</script>
</body>
</html>
